org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=true

# Enable multi-module virtual package import (Kotlin 2.1+)
kotlin.mpp.import.enable.km.metadata=true

# Performance targets
frame61.minSdk=22
frame61.targetSdk=36
frame61.compileSdk=36
frame61.abiFilters=arm64-v8a;armeabi-v7a
frame61.coilFormat=RGB_565
# M6 (TMDB/Badges/Trakt) ist optional und standardmaessig aus.
frame61.m6=false
