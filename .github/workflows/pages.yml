name: pages

# GitHub Pages ist fuer dieses private Repo im aktuellen Plan nicht freigeschaltet
# (API 422). Der Workflow ist korrekt vorbereitet und wird erst genutzt, wenn
# Pages verfuegbar ist; bis dahin bleibt er dormant (nur manuell startbar).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Site-Artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
