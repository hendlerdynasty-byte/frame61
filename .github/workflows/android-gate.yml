name: android-gate

on:
  push:
    branches: [phase-a]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: Build, test and lint
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs=-Xmx2048m \
            -Pkotlin.compiler.execution.strategy=in-process \
            gate :app:assembleAcceptance

      - name: Upload debug and perf APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame61-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/acceptance/app-acceptance-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame61-gate-evidence-${{ github.sha }}
          path: |
            **/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/lint-results-*
          if-no-files-found: error
          retention-days: 14

  release:
    # Unsigned release artefacts only. The signature is added on the Mac with
    # the out-of-repo keystore; no signing secret ever reaches this runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: Build unsigned release APK and AAB
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs=-Xmx2048m \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:assembleRelease :app:bundleRelease

      - name: Upload unsigned release artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame61-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
